name: Django CI — Stock Portfolio Tracker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run 39 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────
      # mysqlclient needs libmysqlclient-dev on Linux
      - name: Install system dependencies (mysqlclient)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmysqlclient-dev default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 4. Run Django tests with SQLite (no MySQL needed) ─────────
      - name: Run test suite
        run: |
          cd config
          python manage.py test portfolio \
            --settings=config.test_settings \
            --verbosity=2

      # ── 5. Check for any outstanding migrations ───────────────────
      - name: Check for missing migrations
        run: |
          cd config
          python manage.py makemigrations --check --dry-run \
            --settings=config.test_settings
